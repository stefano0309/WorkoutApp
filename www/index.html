<!doctype html>
<html lang="it" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>Hybrid Training System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --bs-body-bg: #0b1020;
        --bs-body-color: #eef3ff;
        --panel-bg: #121a2d;
        --panel2-bg: #19233a;
        --border-color: #2c3753;
        --accent-orange: #ff5a36;
        --accent-orange-2: #ff7a52;
        --accent-blue: #b7c6ff;
        --accent-blue-2: #8da3f5;
      }
      body {
        background: linear-gradient(140deg, #080d19, #0e1528 55%, #101a31);
        min-height: 100vh;
      }
      .sidebar {
        background: rgba(10, 15, 30, 0.95);
        border-right: 1px solid var(--border-color);
        backdrop-filter: blur(12px);
      }
      .card-custom {
        background: linear-gradient(
          180deg,
          rgba(22, 31, 51, 0.96),
          rgba(15, 22, 40, 0.96)
        );
        border: 1px solid var(--border-color);
        border-radius: 16px;
      }
      .set-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        transition: border-color 0.2s;
      }
      .set-card:focus-within {
        border-color: #62d4ff;
      }
      .timer-display {
        font-size: 4rem;
        font-weight: 900;
        letter-spacing: 2px;
      }
      .metric-val {
        font-size: 1.75rem;
        font-weight: 800;
      }
      .heat-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
      }
      .heat-labels {
        margin-bottom: 6px;
      }
      .heat-label {
        text-align: center;
        font-size: 0.72rem;
        color: #9fb0d0;
        text-transform: uppercase;
      }
      .heat-cell {
        aspect-ratio: 1 / 1;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.72rem;
        color: #eef3ff;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .heat-empty {
        background: transparent;
        border: none;
      }
      .heat-today {
        outline: 2px solid #62d4ff;
        outline-offset: -2px;
      }
      .heat-swatch {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        display: inline-block;
      }

      /* ===== HERO DASHBOARD (ispirato alle reference @omoakin.ux) ===== */
      .avatar-circle {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: linear-gradient(160deg, #3a4a7a, #1c2440);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        color: #fff;
        font-size: 1rem;
        flex-shrink: 0;
      }
      .bell-btn {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        color: #eef3ff;
        flex-shrink: 0;
      }
      .bell-dot {
        position: absolute;
        top: 8px;
        right: 10px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent-orange);
        border: 2px solid #0e1528;
      }
      .hero-card {
        border-radius: 26px;
        padding: 20px;
        min-height: 190px;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }
      .hero-card-orange {
        background: linear-gradient(
          150deg,
          var(--accent-orange-2),
          var(--accent-orange)
        );
        color: #fff;
      }
      .hero-card-blue {
        background: linear-gradient(
          150deg,
          var(--accent-blue),
          var(--accent-blue-2)
        );
        color: #14183a;
      }
      .hero-icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.28);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .checklist-pill {
        background: rgba(255, 255, 255, 0.16);
        border: 1.5px dashed rgba(255, 255, 255, 0.45);
        border-radius: 18px;
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .checklist-pill:hover {
        background: rgba(255, 255, 255, 0.24);
      }
      .checklist-pill.done {
        border-style: solid;
      }
      .checklist-check {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 0.8rem;
      }
      .checklist-check.done {
        background: #fff;
        color: var(--accent-orange);
        border-color: #fff;
      }
      .start-pill-btn {
        background: #fff;
        color: #14183a;
        border-radius: 30px;
        padding: 10px 10px 10px 20px;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        font-weight: 700;
        border: none;
        margin-top: auto;
        align-self: flex-start;
      }
      .start-pill-btn .play-dot {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: #14183a;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .progress-ring-card {
        background: #fff;
        color: #14183a;
        border-radius: 24px;
        padding: 18px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .ring-icon-circle {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: var(--accent-orange);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        flex-shrink: 0;
      }
      .ring {
        width: 62px;
        height: 62px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        background: conic-gradient(
          var(--accent-orange) calc(var(--pct) * 1%),
          rgba(20, 24, 58, 0.12) 0
        );
      }
      .ring-inner {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 0.82rem;
        color: #14183a;
      }
      .timeline-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 0;
        position: relative;
      }
      .timeline-dot-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        align-self: stretch;
      }
      .timeline-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid var(--accent-orange-2);
        background: transparent;
        flex-shrink: 0;
      }
      .timeline-dot.filled {
        background: var(--accent-orange-2);
      }
      .timeline-line {
        width: 2px;
        flex: 1;
        background: repeating-linear-gradient(
          to bottom,
          var(--border-color) 0,
          var(--border-color) 4px,
          transparent 4px,
          transparent 8px
        );
        margin-top: 2px;
      }
      .now-pill {
        background: #35d07f;
        color: #08240f;
        font-weight: 700;
        border: none;
        border-radius: 20px;
        padding: 8px 18px;
      }

      /* ===== BOTTOM NAV MOBILE ===== */
      .bottom-nav-wrap {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 12px;
        display: flex;
        justify-content: center;
        z-index: 1030;
        pointer-events: none;
      }
      .bottom-nav-pill {
        pointer-events: auto;
        background: rgba(14, 19, 38, 0.96);
        border: 1px solid var(--border-color);
        border-radius: 40px;
        padding: 6px;
        display: flex;
        align-items: center;
        gap: 4px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(10px);
      }
      .bottom-nav-item {
        border: none;
        background: transparent;
        color: #9fb0d0;
        width: 46px;
        height: 46px;
        border-radius: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.15rem;
      }
      .bottom-nav-item.active {
        background: var(--accent-orange);
        color: #fff;

        padding: 0 16px;
        gap: 8px;
        font-size: 0.95rem;
        font-weight: 700;
      }

      /* ===== QUICK LINKS (interconnessione tra tab) ===== */
      .quick-links-row {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
        scrollbar-width: thin;
      }
      .quick-link-pill {
        flex-shrink: 0;
        border: 1px solid var(--border-color);
        background: rgba(255, 255, 255, 0.03);
        color: #9fb0d0;
        border-radius: 20px;
        padding: 7px 14px;
        font-size: 0.82rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .quick-link-pill.active {
        background: var(--accent-orange);
        border-color: var(--accent-orange);
        color: #fff;
      }

      /* ===== STILE STRAVA (sezione Corsa) ===== */
      .strava-hero {
        background: linear-gradient(120deg, #fc4c02, #ff7a1a);
        border-radius: 22px;
        padding: 22px;
        color: #fff;
        margin-bottom: 20px;
      }
      .strava-stat-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        margin-top: 14px;
      }
      .strava-stat-grid > div {
        text-align: center;
        border-right: 1px solid rgba(255, 255, 255, 0.25);
      }
      .strava-stat-grid > div:last-child {
        border-right: none;
      }
      .strava-stat-num {
        font-size: 1.5rem;
        font-weight: 800;
        line-height: 1.1;
      }
      .strava-stat-label {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        opacity: 0.85;
      }
      .strava-activity-card {
        background: linear-gradient(
          180deg,
          rgba(22, 31, 51, 0.96),
          rgba(15, 22, 40, 0.96)
        );
        border: 1px solid var(--border-color);
        border-left: 4px solid #fc4c02;
        border-radius: 14px;
        padding: 16px;
      }
      .strava-icon-badge {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(252, 76, 2, 0.15);
        color: #fc4c02;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        flex-shrink: 0;
      }
      .strava-metric {
        text-align: center;
        padding: 6px 4px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.03);
      }
      .strava-metric-val {
        font-weight: 800;
        font-size: 1rem;
        color: #fff;
      }
      .strava-metric-label {
        font-size: 0.68rem;
        color: #9fb0d0;
        text-transform: uppercase;
      }
      .strava-btn {
        background: #fc4c02;
        border: none;
        color: #fff;
        font-weight: 700;
        border-radius: 20px;
        padding: 8px 18px;
      }
      .strava-btn.done {
        background: rgba(255, 255, 255, 0.08);
        color: #35d07f;
        border: 1px solid #35d07f;
      }

      /* ===== FAB REGISTRAZIONE RAPIDA ===== */
      .fab-log-btn {
        position: fixed;
        right: 20px;
        bottom: 92px;
        width: 58px;
        height: 58px;
        border-radius: 50%;
        border: none;
        background: linear-gradient(
          160deg,
          var(--accent-orange-2),
          var(--accent-orange)
        );
        color: #fff;
        font-size: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 28px rgba(255, 90, 54, 0.45);
        z-index: 1035;
        transition: transform 0.15s;
      }
      .fab-log-btn:active {
        transform: scale(0.92);
      }
      @media (min-width: 992px) {
        .fab-log-btn {
          bottom: 28px;
        }
      }
      .quick-log-tile {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 14px;
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        color: #eef3ff;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .quick-log-tile:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .quick-log-tile.done {
        border-color: #35d07f;
        opacity: 0.7;
      }
      .quick-log-tile .qlt-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: rgba(252, 76, 2, 0.15);
        color: #fc4c02;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.15rem;
        flex-shrink: 0;
      }
      .quick-log-tile.strength .qlt-icon {
        background: rgba(98, 212, 255, 0.15);
        color: #62d4ff;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid min-vh-100 p-0">
      <div class="row g-0 min-vh-100">
        <aside

          <div class="d-flex flex-column h-100">
            <div class="mb-3">
              <div class="h5 fw-bold mb-0 text-white">HYBRID TRAINING</div>
              <small class="text-secondary fw-semibold tracking-wide"

              >
              <div

                class="badge bg-success bg-opacity-25 text-success border border-success w-100 mt-2 py-2"

    <div class="modal fade" id="appModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

    <script>
      const STORAGE_KEY = "hybridTrainingSystem";
      const STORAGE_VERSION = 2;
      const NATIVE_FILE = "hybrid-training-data.json";

      // ===== ADAPTER DI PERSISTENZA (localStorage + Capacitor Filesystem) =====
      // In un WebView "nudo" o nel browser, usiamo solo localStorage.
      // Una volta impacchettata con Capacitor (npx cap add android/ios),
      // il runtime nativo espone window.Capacitor: in quel caso scriviamo
      // ANCHE un file JSON persistente nella sandbox dell'app (Directory.Data),
      // molto più resiliente della sola cache WebView.
      const NativeStorage = {
        isNative() {
          try {
            return !!(
              window.Capacitor &&
              window.Capacitor.isNativePlatform &&
              window.Capacitor.isNativePlatform() &&
              window.Capacitor.Plugins &&
              window.Capacitor.Plugins.Filesystem
            );
          } catch (e) {
            return false;
          }
        },
        async write(data) {
          if (!this.isNative()) return false;
          try {
            const { Filesystem, Directory, Encoding } =
              window.Capacitor.Plugins;
            await Filesystem.writeFile({
              path: NATIVE_FILE,
              data: JSON.stringify(data),
              directory: Directory.Data,
              encoding: Encoding.UTF8,
            });
            return true;
          } catch (e) {
            console.error("NativeStorage write failed", e);
            return false;
          }
        },
        async read() {
          if (!this.isNative()) return null;
          try {
            const { Filesystem, Directory, Encoding } =
              window.Capacitor.Plugins;
            const res = await Filesystem.readFile({
              path: NATIVE_FILE,
              directory: Directory.Data,
              encoding: Encoding.UTF8,
            });
            return JSON.parse(res.data);
          } catch (e) {
            // il file potrebbe non esistere ancora al primo avvio: non è un errore
            return null;
          }
        },
      };
      const DEFAULT_STATE = {
        _storageVersion: STORAGE_VERSION,
        profile: null,
        assessment: null,
        meso: { week: 1, started: new Date().toISOString(), history: [] },
        sessions: {},
        log: [],
        statsView: {
          year: new Date().getFullYear(),
          month: new Date().getMonth(),
        },
        timer: { mode: "rest", seconds: 0, running: false },
        activePage: "dashboard",
        settings: { dynamicAlert: true, sound: true },
        zoneTest: null,
        lastSavedAt: null,
      };

      let bsModal = null;

      function clone(v) {
        return JSON.parse(JSON.stringify(v));
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return clone(DEFAULT_STATE);
          const p = JSON.parse(raw);
          return {
            ...clone(DEFAULT_STATE),
            ...p,
            _storageVersion: STORAGE_VERSION,
            meso: { ...DEFAULT_STATE.meso, ...(p.meso || {}) },
            timer: { ...DEFAULT_STATE.timer, ...(p.timer || {}) },
            settings: { ...DEFAULT_STATE.settings, ...(p.settings || {}) },
            log: Array.isArray(p.log) ? p.log : [],
            statsView: { ...DEFAULT_STATE.statsView, ...(p.statsView || {}) },
          };
        } catch (e) {
          console.warn("localStorage read failed", e);
          return clone(DEFAULT_STATE);
        }
      }

      const state = loadState();

      const WEEK = {
        1: { name: "Accumulo", volume: 1.0, rpe: "6–7", badge: "bg-success" },
        2: { name: "Accumulo", volume: 1.08, rpe: "7–8", badge: "bg-success" },
        3: {
          name: "Picco",
          volume: 1.15,
          rpe: "8–9",
          badge: "bg-warning text-dark",
        },
        4: {
          name: "Scarico",
          volume: 0.65,
          rpe: "5–6",
          badge: "bg-info text-dark",
        },
      };

      const SCHEDULE = [
        {
          day: "Lunedì",
          title: "Upper Strength",

        },
        {

        },
        {

        },
        {

        },

        },

      const LIB = {
        push: [
          [

          ],

      function logDatesSet(typeFilter) {
        const map = {};
        state.log.forEach((l) => {
          if (typeFilter && l.type !== typeFilter) return;
          map[l.date] = (map[l.date] || 0) + 1;
        });
        if (!typeFilter || typeFilter === "strength") {
          // include legacy strength sessions saved before logging existed
          Object.values(state.sessions).forEach((s) => {
            if (!s.at) return;
            const k = todayKey(new Date(s.at));
            const alreadyCounted = state.log.some(
              (l) =>
                l.date === k && l.type === "strength" && l.label === s.name,
            );
            if (!alreadyCounted) map[k] = (map[k] || 0) + 1;
          });
        }
        return map;
      }

      function computeStreaks(typeFilter) {
        const map = logDatesSet(typeFilter);
        const days = Object.keys(map).sort();
        if (!days.length) return { current: 0, best: 0 };

        let best = 1,
          run = 1;
        for (let i = 1; i < days.length; i++) {
          const prev = new Date(days[i - 1]);
          const cur = new Date(days[i]);
          const diff = Math.round((cur - prev) / 86400000);
          if (diff === 1) {
            run++;
          } else if (diff > 1) {
            run = 1;
          }
          best = Math.max(best, run);
        }

        // current streak: walk backwards from today (o ieri, per non azzerare subito se non ci si è ancora allenati oggi)
        let current = 0;
        let cursor = new Date();
        cursor.setHours(0, 0, 0, 0);
        if (!map[todayKey(cursor)]) {
          cursor.setDate(cursor.getDate() - 1);
        }
        while (map[todayKey(cursor)]) {
          current++;
          cursor.setDate(cursor.getDate() - 1);
        }
        return { current, best };
      }

      function runDurationMinutes(title) {
        const s = RUN_SESSIONS.find((r) => r.title === title);
        if (!s) return 0;
        const m = s.duration.match(/(\d+)/);
        return m ? parseInt(m[1], 10) : 0;
      }

      function runStatsThisWeek() {
        const now = new Date();
        const start = new Date(now);
        start.setDate(now.getDate() - ((now.getDay() + 6) % 7));
        start.setHours(0, 0, 0, 0);
        const runs = state.log.filter((l) => {
          if (l.type !== "run") return false;
          const d = new Date(l.date);
          return d >= start;
        });
        const minutes = runs.reduce(
          (sum, r) => sum + runDurationMinutes(r.type === "run" ? r.label : ""),
          0,
        );
        return { count: runs.length, minutes };
      }

      function runCategoryCountThisMonth(category) {
        const now = new Date();
        return state.log.filter((l) => {
          if (l.type !== "run" || l.label !== category) return false;
          const d = new Date(l.date);
          return (
            d.getFullYear() === now.getFullYear() &&
            d.getMonth() === now.getMonth()
          );
        }).length;
      }

      function sessionsByWeek(nWeeks) {
        const map = logDatesSet();
        const labels = [],
          values = [];
        const now = new Date();
        now.setHours(0, 0, 0, 0);
        for (let w = nWeeks - 1; w >= 0; w--) {
          const start = new Date(now);
          start.setDate(start.getDate() - start.getDay() - 7 * w + 1);
          let count = 0;
          for (let d = 0; d < 7; d++) {
            const dd = new Date(start);
            dd.setDate(start.getDate() + d);
            count += map[todayKey(dd)] || 0;
          }
          labels.push(
            start.toLocaleDateString("it-IT", {
              day: "2-digit",
              month: "2-digit",
            }),
          );
          values.push(count);
        }
        return { labels, values };
      }

      function countsByType() {
        let strength = 0,
          run = 0;
        state.log.forEach((l) => {
          if (l.type === "strength") strength++;
          else if (l.type === "run") run++;
        });
        Object.values(state.sessions).forEach((s) => {
          const k = todayKey(new Date(s.at || Date.now()));
          const alreadyCounted = state.log.some(
            (l) => l.date === k && l.type === "strength" && l.label === s.name,
          );
          if (!alreadyCounted) strength++;
        });
        return { strength, run };
      }

      function weeklyAvgRpe(nWeeks) {
        const buckets = {};
        Object.entries(state.sessions).forEach(([k, v]) => {
          if (!v.at || !v.sets?.length) return;
          const d = new Date(v.at);
          const start = new Date(d);
          start.setDate(d.getDate() - d.getDay() + 1);
          const wk = todayKey(start);
          const rpes = v.sets.map((s) => +s.rpe).filter(Boolean);
          if (!rpes.length) return;
          if (!buckets[wk]) buckets[wk] = [];
          buckets[wk].push(...rpes);
        });
        const keys = Object.keys(buckets).sort().slice(-nWeeks);
        return {
          labels: keys.map((k) =>
            new Date(k).toLocaleDateString("it-IT", {
              day: "2-digit",
              month: "2-digit",
            }),
          ),
          values: keys.map((k) => {
            const arr = buckets[k];
            return +(arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(1);
          }),
        };
      }

      function monthSessionsCount(year, month) {
        const map = logDatesSet();
        let total = 0;
        Object.entries(map).forEach(([k, v]) => {
          const d = new Date(k);
          if (d.getFullYear() === year && d.getMonth() === month) total += v;
        });
        return total;

      function runAssessment() {
        const vals = {
          push: +document.getElementById("a_push").value || 0,
          pull: +document.getElementById("a_pull").value || 0,
          squat: +document.getElementById("a_squat").value || 0,
          plank: +document.getElementById("a_plank").value || 0,
          run: +document.getElementById("a_run").value || 0,
        };
        const score = Object.entries(vals).reduce(
          (s, [k, v]) => s + scoreRanges(v, k),
          0,
        );
        const profileId =
          "HTS-" +
          [score, vals.push, vals.pull, vals.squat, vals.plank, vals.run]
            .map((x) => Math.round(x))
            .join("-");
        state.profile = {
          id: profileId,
          level: levelFromScore(score),
          score,
          createdAt: new Date().toISOString(),
          height: +document.getElementById("a_h").value || null,
          weight: +document.getElementById("a_w").value || null,
          hrMax: +document.getElementById("a_hrmax").value || null,
        };
        state.assessment = vals;
        state.meso = {
          week: 1,
          started: new Date().toISOString(),
          history: [],
        };
        save();
        route("dashboard");
      }

      function changeWeek(delta) {

      function completeMeso() {
        const reps = Object.entries(state.sessions)
          .filter(([k]) => k.startsWith("w3-"))
          .flatMap(([, v]) => v.sets || [])
          .map((s) => +s.rpe)
          .filter(Boolean);
        const avg = reps.length
          ? reps.reduce((a, b) => a + b, 0) / reps.length
          : null;
        state.meso.history.push({ week: 3, avgRpe: avg });
        state.meso.week = 1;
        state.meso.started = new Date().toISOString();
        save();
        route("retest");
      }

            done: true,

        addLog("strength", name, { key });

        const hasRpe10 = sets.some((s) => s.rpe >= 10);

      function shiftStatsMonth(delta) {
        let m = state.statsView.month + delta;

      function heatmapHTML(year, month) {
        const map = logDatesSet();
        const first = new Date(year, month, 1);
        const startOffset = (first.getDay() + 6) % 7; // lunedì = 0
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const todayK = todayKey();

        const cells = [];
        for (let i = 0; i < startOffset; i++) {
          cells.push(`<div class="heat-cell heat-empty"></div>`);
        }
        for (let d = 1; d <= daysInMonth; d++) {
          const dateObj = new Date(year, month, d);
          const k = todayKey(dateObj);
          const count = map[k] || 0;
          const alpha =
            count === 0 ? 0.06 : count === 1 ? 0.35 : count === 2 ? 0.6 : 0.9;
          const isToday = k === todayK ? "heat-today" : "";
          cells.push(
            `<div class="heat-cell ${isToday}" style="background:rgba(98,212,255,${alpha})" title="${k} · ${count} sessione/i">${d}</div>`,
          );

    ${["L", "M", "M", "G", "V", "S", "D"].map((d) => `<div class="heat-label">${d}</div>`).join("")}

      function beep() {
        try {
          const a = new AudioContext(),
            o = a.createOscillator(),
            g = a.createGain();
          o.connect(g);
          g.connect(a.destination);
          o.frequency.value = 880;
          g.gain.value = 0.06;
          o.start();
          o.stop(a.currentTime + 0.12);
        } catch (e) {}

      let timerInt;
      function startTimer(seconds, label) {
        clearInterval(timerInt);

      <h5 class="modal-title"><i class="bi bi-stopwatch text-info me-2"></i> Recupero · ${esc(label)}</h5>

      <button class="btn btn-secondary px-4" onclick="stopTimer()">Interrompi Timer</button>
    </div>`;

        openModal(content);

        timerInt = setInterval(() => {
          if (!state.timer.running) return;
          state.timer.seconds--;
          const el = document.getElementById("timerN");

        );

      function exportData() {
        const b = new Blob(
          [
            JSON.stringify(
              { ...state, exportedAt: new Date().toISOString() },
              null,
              2,
            ),
          ],
          { type: "application/json" },
        );
        const u = URL.createObjectURL(b);
        const a = document.createElement("a");
        a.href = u;
        a.download = "hybrid-training-backup.json";
        a.click();
        URL.revokeObjectURL(u);
      }

      function importData(ev) {
        const f = ev.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const imported = JSON.parse(r.result);
            Object.keys(DEFAULT_STATE).forEach((k) => delete state[k]);
            Object.assign(state, clone(DEFAULT_STATE), imported, {
              _storageVersion: STORAGE_VERSION,
            });
            save();
            render();
            alert("Backup importato correttamente.");
          } catch (e) {
            alert("File JSON non valido.");
          }
        };
        r.readAsText(f);
      }

      function resetData() {
        if (
          confirm("Sei sicuro di voler cancellare tutti i dati registrati?")

          localStorage.removeItem(STORAGE_KEY);

        logRun(category, dayLabel);

      }

      render();
      updateSaveIndicator("ok");
      hydrateFromNativeStorage();

      async function hydrateFromNativeStorage() {
        if (!NativeStorage.isNative()) return;
        try {
          const native = await NativeStorage.read();
          if (native && native.lastSavedAt) {
            // il file nativo è la fonte di verità più duratura: se più
            // recente (o se localStorage è vuoto/più vecchio) lo adottiamo
            const localTime = state.lastSavedAt
              ? new Date(state.lastSavedAt).getTime()
              : 0;
            const nativeTime = new Date(native.lastSavedAt).getTime();
            if (nativeTime >= localTime) {
              Object.keys(DEFAULT_STATE).forEach((k) => delete state[k]);
              Object.assign(state, clone(DEFAULT_STATE), native, {
                _storageVersion: STORAGE_VERSION,
              });
              localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
              render();
            }
          } else if (state.lastSavedAt) {
            // primo avvio nativo: non c'è ancora il file, lo creiamo dai
            // dati locali esistenti così da avere subito una copia persistente
            NativeStorage.write(state).catch(() => {});
          }
        } catch (e) {
          console.error("Hydration da storage nativo fallita", e);
        }
      }
    </script>
