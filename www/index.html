<!doctype html>
<html lang="it" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>Hybrid Training System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="accessibility.css">
  </head>
  <body>
    <a class="skip-link" href="#app">Vai al contenuto principale</a>

    <div class="container-fluid min-vh-100 p-0">
      <div class="row g-0 min-vh-100">
        <aside
          class="col-12 col-lg-3 col-xl-2 sidebar p-3 border-bottom border-lg-end"
          aria-label="Navigazione principale"
        >
          <div class="d-flex flex-column h-100">
            <div class="mb-3">
              <div class="h5 fw-bold mb-0 text-white">HYBRID TRAINING</div>
              <small class="text-secondary fw-semibold tracking-wide"
                >SYSTEM · VOL. 1–3</small
              >
              <div
                id="saveStatus"
                class="badge bg-success bg-opacity-25 text-success border border-success w-100 mt-2 py-2"
                role="status"
                aria-live="polite"
              >
                Storage locale attivo
              </div>
            </div>

            <div class="p-2 border rounded-3 bg-dark bg-opacity-50 mb-3">
              <strong id="miniLevel" class="d-block text-truncate"
                >Profilo non configurato</strong
              >
              <span
                id="miniId"
                class="small text-secondary d-block text-truncate"
                >Completa l'assessment</span
              >
            </div>

            <nav
              id="nav"
              class="nav nav-pills d-none d-lg-flex flex-lg-column gap-1 overflow-auto flex-nowrap mb-3"
              aria-label="Sezioni dell'applicazione"
            ></nav>
          </div>
        </aside>

        <main
          class="col-12 col-lg-9 col-xl-10 p-3 p-md-4 pb-5 mb-5 mb-lg-0"
          id="app"
          tabindex="-1"
          aria-label="Contenuto principale"
        ></main>
      </div>
    </div>

    <div class="bottom-nav-wrap d-lg-none">
      <nav class="bottom-nav-pill" id="bottomNav" aria-label="Navigazione mobile"></nav>
    </div>

    <button
      class="fab-log-btn"
      id="fabLog"
      type="button"
      onclick="openQuickLog()"
      title="Registrazione rapida"
      aria-label="Apri registrazione rapida"
    >
      <i class="bi bi-plus-lg" aria-hidden="true"></i>
    </button>

    <div class="modal fade" id="appModal" tabindex="-1" aria-hidden="true" aria-labelledby="modalTitle">
      <div class="modal-dialog modal-dialog-centered">
        <div
          class="modal-content bg-dark border-secondary text-light"
          id="modalContent"
        ></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

    <!--
      Integrazione Firebase (Auth Google + Realtime Database).
      Usa la sintassi modulare v9+: va caricata come modulo a parte perché
      "import" non è disponibile negli script classici usati dal resto
      dell'app. Espone un'API minima su window.__fb, consumata dall'oggetto
      CloudSync nello script principale qui sotto.
    -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
      import {
        getAnalytics,
        isSupported as analyticsIsSupported,
      } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
      import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
      import {
        getDatabase,
        ref,
        set,
        get,
        update,
        onValue,
        off,
      } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCD7WjWdH_dDjUbfAs-xuMQHC8NWL8KYqQ",
        authDomain: "workout-7c6ec.firebaseapp.com",
        projectId: "workout-7c6ec",
        storageBucket: "workout-7c6ec.firebasestorage.app",
        messagingSenderId: "729092751447",
        appId: "1:729092751447:web:1ca864dc1b2868291da312",
        measurementId: "G-N8L226X7WH",
      };

      const app = initializeApp(firebaseConfig);
      analyticsIsSupported()
        .then((ok) => {
          if (ok) getAnalytics(app);
        })
        .catch(() => {});

      const auth = getAuth(app);
      const db = getDatabase(app);
      const provider = new GoogleAuthProvider();

      const isNativeShell = () =>
        !!(
          window.Capacitor &&
          window.Capacitor.isNativePlatform &&
          window.Capacitor.isNativePlatform()
        );

      // API minima esposta allo script "classico" principale dell'app.
      window.__fb = {
        async signIn() {
          if (isNativeShell()) {
            // Il popup OAuth di Google non funziona in modo affidabile
            // dentro una WebView nativa Capacitor (Google blocca i
            // login da "embedded user agent" per policy di sicurezza).
            // Per l'app Android/iOS reale serve il plugin nativo
            // @capacitor-firebase/authentication: vedi la guida fornita.
            throw new Error("native-google-signin-not-configured");
          }
          const res = await signInWithPopup(auth, provider);
          return res.user;
        },
        signOutUser() {
          return signOut(auth);
        },
        onAuthChange(cb) {
          return onAuthStateChanged(auth, cb);
        },
        async readState(uid) {
          const snap = await get(ref(db, "users/" + uid + "/state"));
          return snap.exists() ? snap.val() : null;
        },
        writeState(uid, data) {
          return set(ref(db, "users/" + uid + "/state"), data);
        },
        watchState(uid, cb) {
          const r = ref(db, "users/" + uid + "/state");
          onValue(r, (snap) => cb(snap.exists() ? snap.val() : null));
          return () => off(r);
        },
        async readUsername(uid) {
          const snap = await get(ref(db, "users/" + uid + "/profile/username"));
          return snap.exists() ? snap.val() : null;
        },
        async claimUsername(uid, username) {
          const key = username.trim().toLowerCase().replace(/\s+/g, "_");
          if (!key) throw new Error("empty-username");
          const takenSnap = await get(ref(db, "usernames/" + key));
          if (takenSnap.exists() && takenSnap.val() !== uid) {
            throw new Error("username-taken");
          }
          await set(ref(db, "usernames/" + key), uid);
          await set(
            ref(db, "users/" + uid + "/profile/username"),
            username.trim(),
          );
          return username.trim();
        },
      };
      window.dispatchEvent(new CustomEvent("firebase-ready"));
    </script>

    <script src="index.js"></script>
    <script src="accessibility-runtime.js"></script>
  </body>
</html>
