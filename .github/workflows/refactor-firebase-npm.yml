name: Refactor Firebase npm runtime

on:
  push:
    branches:
      - refactor/p17-firebase-npm

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[firebase-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Generate lockfile and Firebase bundle
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npx esbuild www/firebase-runtime.entry.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --target=es2020 \
            --minify \
            --outfile=www/firebase-runtime.bundle.js

      - name: Replace runtime Firebase CDN imports
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const files = [
            'www/index.html',
            'www/native-auth.js',
            'www/offline-sync.js',
          ];
          const pattern = /https:\/\/www\.gstatic\.com\/firebase\/12\.18\.0\/[^'\"`]+/g;
          let replacedCount = 0;
          for (const file of files) {
            const before = fs.readFileSync(file, 'utf8');
            const matches = before.match(pattern) || [];
            if (matches.length) {
              fs.writeFileSync(file, before.replace(pattern, './firebase-runtime.bundle.js'));
              replacedCount += matches.length;
              console.log(`${file}: replaced ${matches.length} Firebase CDN import(s)`);
            } else {
              console.log(`${file}: no Firebase CDN imports present; leaving unchanged`);
            }
          }
          if (replacedCount === 0) throw new Error('No Firebase CDN imports were present in any migration target');
          NODE

      - name: Remove one-shot migration workflow
        run: rm -f .github/workflows/refactor-firebase-npm.yml

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json www/firebase-runtime.entry.js www/firebase-runtime.bundle.js www/index.html www/native-auth.js www/offline-sync.js .github/workflows/refactor-firebase-npm.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'refactor: bundle Firebase runtime locally [firebase-generated]'
          git push
