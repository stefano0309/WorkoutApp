name: UI-02 Tokenize CSS

on:
  push:
    branches:
      - audit/ui-02-tokenize

permissions:
  contents: write

jobs:
  tokenize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tokenize CSS
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          css = Path('www/index.css').read_text()
          tokens = Path('src/theme/variables.css').read_text()
          if '--hts-on-light' not in tokens:
              tokens = tokens.replace('  --hts-danger: #dc3545;\n', '  --hts-danger: #dc3545;\n  --hts-on-light: #14183a;\n')
          if '--hts-radius-xl' not in tokens:
              tokens = tokens.replace('  --hts-radius-card-lg: 24px;\n', '  --hts-radius-card-lg: 24px;\n  --hts-radius-xl: 26px;\n')
          Path('src/theme/variables.css').write_text(tokens)
          replacements = {
              '#0b1020':'var(--hts-background)', '#eef3ff':'var(--hts-text)', '#121a2d':'var(--hts-surface)', '#19233a':'var(--hts-surface-2)', '#162033':'var(--hts-surface-3)', '#2c3753':'var(--hts-border)', '#ff5a36':'var(--hts-primary)', '#ff7a52':'var(--hts-primary-soft)', '#b7c6ff':'var(--hts-info-soft)', '#62d4ff':'var(--hts-info)', '#35d07f':'var(--hts-success)', '#08240f':'var(--hts-success-contrast)', '#dc3545':'var(--hts-danger)', '#0e1528':'var(--hts-background-elevated)', '#080d19':'var(--hts-background-deep)', '#9fb0d0':'var(--hts-muted)', '#7f8daa':'var(--hts-muted-strong)', '#ffffff':'var(--hts-primary-contrast)', '#fff':'var(--hts-primary-contrast)', '#14183a':'var(--hts-on-light)'}
          for old, new in replacements.items(): css = css.replace(old, new)
          for px, token in [('26','var(--hts-radius-xl)'),('24','var(--hts-radius-card-lg)'),('16','var(--hts-radius-card)'),('14','var(--hts-radius-card)'),('12','var(--hts-radius-control)'),('10','var(--hts-radius-control)'),('20','var(--hts-radius-pill)'),('30','var(--hts-radius-pill)'),('40','var(--hts-radius-pill)')]:
              css = re.sub(r'border-radius:\s*'+px+r'px;', 'border-radius: '+token+';', css)
          css = css.replace('transition: border-color 0.2s;', 'transition: border-color var(--hts-duration-normal) var(--hts-ease-standard);').replace('transition: background 0.15s;', 'transition: background var(--hts-duration-fast) var(--hts-ease-standard);').replace('transition: transform 0.15s;', 'transition: transform var(--hts-duration-fast) var(--hts-ease-standard);')
          css = css.replace('var(--accent-orange-2)', 'var(--hts-primary-soft)').replace('var(--accent-orange)', 'var(--hts-primary)').replace('var(--accent-blue)', 'var(--hts-info-soft)').replace('var(--accent-blue-2)', 'var(--hts-info)').replace('var(--border-color)', 'var(--hts-border)')
          Path('www/index.css').write_text(css)
          PY

      - name: Validate
        run: |
          test -f www/index.css
          test -f src/theme/variables.css
          grep -q -- 'var(--hts-primary)' www/index.css
          grep -q -- 'var(--hts-radius-card)' www/index.css
          grep -q -- 'var(--hts-duration-fast)' www/index.css

      - name: Rebase and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin audit/ui-02-tokenize
          git stash push -u -m ui02-tokenization
          git rebase origin/audit/ui-02-tokenize
          git stash pop
          git add www/index.css src/theme/variables.css
          git rm .github/workflows/ui02-tokenize.yml
          rm -f .ui02-tokenize-trigger
          git add -u
          git commit -m 'style(ui): tokenize legacy dashboard CSS'
          git push origin HEAD:audit/ui-02-tokenize
