name: UI-02 Runtime Tokens

on:
  push:
    branches:
      - audit/ui-02-tokenize

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add runtime token mirror
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('www/index.css')
          css = p.read_text()
          block = '''/* Runtime token mirror: canonical definitions live in src/theme/variables.css. */\n:root {\n  --hts-primary: #ff5a36;\n  --hts-primary-soft: #ff7a52;\n  --hts-primary-contrast: #ffffff;\n  --hts-info: #62d4ff;\n  --hts-info-soft: #b7c6ff;\n  --hts-success: #35d07f;\n  --hts-success-contrast: #08240f;\n  --hts-danger: #dc3545;\n  --hts-on-light: #14183a;\n  --hts-background: #0b1020;\n  --hts-background-deep: #080d19;\n  --hts-background-elevated: #0e1528;\n  --hts-surface: #121a2d;\n  --hts-surface-2: #19233a;\n  --hts-surface-3: #162033;\n  --hts-border: #2c3753;\n  --hts-text: #eef3ff;\n  --hts-muted: #9fb0d0;\n  --hts-muted-strong: #7f8daa;\n  --hts-radius-card: 16px;\n  --hts-radius-card-lg: 24px;\n  --hts-radius-xl: 26px;\n  --hts-radius-control: 12px;\n  --hts-radius-pill: 999px;\n  --hts-duration-fast: 150ms;\n  --hts-duration-normal: 250ms;\n  --hts-ease-standard: cubic-bezier(0.2, 0.8, 0.2, 1);\n}\n\n'''
          if not css.startswith('/* Runtime token mirror:'):
              css = block + css
          css = css.replace('var(--hts-info-soft);\n  --accent-blue-2: #8da3f5;', 'var(--hts-info-soft);\n  --accent-blue-2: var(--hts-info);')
          css = css.replace('#101a31', 'var(--hts-surface-3)')
          css = css.replace('transition:\n    background 0.15s,\n    border-color 0.15s;', 'transition:\n    background var(--hts-duration-fast) var(--hts-ease-standard),\n    border-color var(--hts-duration-fast) var(--hts-ease-standard);')
          p.write_text(css)
          PY
      - name: Validate runtime token source
        run: |
          grep -q 'Runtime token mirror' www/index.css
          grep -q -- '--hts-primary: #ff5a36' www/index.css
          grep -q -- 'var(--hts-duration-fast)' www/index.css
      - name: Commit and remove runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add www/index.css
          git rm .github/workflows/ui02-runtime-tokens.yml
          git commit -m 'style(ui): expose runtime design tokens in static bundle'
          git push
